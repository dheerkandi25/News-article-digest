name: RSS news digest
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview, send]
        default: preview
permissions:
  contents: read
concurrency:
  group: news-digest
  cancel-in-progress: false
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: actions/cache/restore@v4
        with:
          path: |
            data
            .cache/models
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-
      - name: Generate or send digest
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          if [ "$EVENT" = schedule ]; then
            node news.js --send --if-due
          elif [ "$MODE" = send ]; then
            node news.js --send
          else
            node news.js
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data
            .cache/models
          key: news-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-preview
          path: output/
          retention-days: 7
